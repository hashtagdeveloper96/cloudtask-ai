services:
  postgres:
    image: postgres:16
    container_name: cloudtask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudtask
      POSTGRES_USER: cloudtask
      POSTGRES_PASSWORD: cloudtask_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtask -d cloudtask"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
